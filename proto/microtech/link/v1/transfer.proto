syntax = "proto3";

package microtech.link.v1;

option java_multiple_files = true;
option java_package = "com.microtech.link.contract.v1";
option optimize_for = LITE_RUNTIME;

enum TransferType {
  TRANSFER_TYPE_UNSPECIFIED = 0;
  TRANSFER_TYPE_TEST_FILE = 1;
}

enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  TRANSFER_STATE_PENDING = 1;
  TRANSFER_STATE_ACTIVE = 2;
  TRANSFER_STATE_VERIFYING = 3;
  TRANSFER_STATE_SUCCEEDED = 4;
  TRANSFER_STATE_FAILED = 5;
  TRANSFER_STATE_CANCELED = 6;
}

message TransferStart {
  TransferType type = 1;
  fixed64 total_length = 2;
  bytes sha256 = 3;
}

message TransferCancel {}

message TransferBlockAck {
  fixed64 next_offset = 1;
  uint32 credits = 2;
}

message TransferStatus {
  TransferState state = 1;
  fixed64 committed_offset = 2;
}

message TransferControl {
  fixed64 transfer_id = 1;
  oneof body {
    TransferStart start = 10;
    TransferCancel cancel = 11;
    TransferBlockAck block_ack = 12;
    TransferStatus status = 13;
  }
}
