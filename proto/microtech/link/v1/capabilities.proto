syntax = "proto3";

package microtech.link.v1;

option java_multiple_files = true;
option java_package = "com.microtech.link.contract.v1";
option optimize_for = LITE_RUNTIME;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ProfileVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum LinkFeature {
  LINK_FEATURE_UNSPECIFIED = 0;
  LINK_FEATURE_ENCRYPTED_EVENTS = 1;
  LINK_FEATURE_TEST_FILE_TRANSFER = 2;
}

message FramingLimits {
  uint32 framing_version = 1;
  uint32 header_bytes = 2;
  uint32 preferred_att_mtu = 3;
  uint32 maximum_control_message_bytes = 4;
  uint32 maximum_session_message_bytes = 5;
}

message SecurityRequirements {
  bool le_secure_connections_only = 1;
  uint32 encryption_key_bytes = 2;
  uint32 maximum_bonds = 3;
  uint32 protocomm_security_version = 4;
  uint32 protocomm_security_patch_version = 5;
  bool local_confirmation_required = 6;
  bool application_credential_required = 7;
}

message Capabilities {
  ProtocolVersion protocol_version = 1;
  ProfileVersion profile_version = 2;
  FramingLimits framing = 3;
  SecurityRequirements security = 4;
  repeated LinkFeature features = 5;
}

message GetCapabilitiesRequest {}
