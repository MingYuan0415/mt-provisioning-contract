syntax = "proto3";

package microtech.link.v1;

option java_multiple_files = true;
option java_package = "com.microtech.link.contract.v1";
option optimize_for = LITE_RUNTIME;

enum LinkError {
  LINK_ERROR_UNSPECIFIED = 0;
  LINK_ERROR_OK = 1;
  LINK_ERROR_MALFORMED_FRAME = 2;
  LINK_ERROR_UNSUPPORTED_VERSION = 3;
  LINK_ERROR_UNSUPPORTED_OPERATION = 4;
  LINK_ERROR_UNSUPPORTED_CAPABILITY = 5;
  LINK_ERROR_UNAUTHENTICATED = 6;
  LINK_ERROR_PERMISSION_DENIED = 7;
  LINK_ERROR_CONFIRMATION_REQUIRED = 8;
  LINK_ERROR_INVALID_ARGUMENT = 9;
  LINK_ERROR_BUSY = 10;
  LINK_ERROR_NOT_FOUND = 11;
  LINK_ERROR_RESOURCE_EXHAUSTED = 12;
  LINK_ERROR_CONFLICT = 13;
  LINK_ERROR_UNAVAILABLE = 14;
  LINK_ERROR_STORAGE = 15;
  LINK_ERROR_INTERNAL = 16;
}
