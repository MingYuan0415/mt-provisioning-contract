name: contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@9672cee01808979ea1249f81d6d321217b9a10f6 # v1.47.2
        with:
          version: 1.47.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: buf format --diff --exit-code
      - run: buf lint
      - run: buf build --as-file-descriptor-set -o /tmp/provisioning.binpb
      - run: python scripts/validate_fixtures.py --descriptor-set /tmp/provisioning.binpb
      - run: python -m unittest discover -s tests -v
      - run: python -O scripts/validate_fixtures.py --descriptor-set /tmp/provisioning.binpb
      - name: Check wire compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'
          fi
